[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/speedata/xml-lsp"

[workspace.dependencies]
# Internal crates
xml-ast = { path = "crates/xml-ast" }
xml-parser = { path = "crates/xml-parser" }
xml-schema = { path = "crates/xml-schema" }
xml-validation = { path = "crates/xml-validation" }
xml-languages = { path = "crates/xml-languages" }
xml-completion = { path = "crates/xml-completion" }
xml-hover = { path = "crates/xml-hover" }

# External dependencies
quick-xml = "0.36"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
dashmap = "6"
insta = "1"

[profile.release]
lto = "thin"
